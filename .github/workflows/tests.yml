name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install "lupa>=2.8,<3"
      - run: python -c "import lupa.lua51"
      - run: python -m unittest discover -s tests -t tests
